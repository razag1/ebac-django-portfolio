
{% extends "base.html" %}

{% block content %}

<div class="container">
    <div class="row">
        <div class="col-md-8 card mb-4 mt-3 left top">
            <div class="card-body">

                <h1>{{ post.title }}</h1>

                <p class="text-muted">
                    {{ post.created_at|date:"d/m/Y H:i" }}
                </p>

                <p class="card-text">
                    {{ post.content|linebreaks }}
                </p>

                <a href="{% url 'home' %}"
                   class="btn btn-primary">
                    Voltar
                </a>

            </div>
        </div>

        {% block sidebar %}
            {% include "sidebar.html" %}
        {% endblock sidebar %}

    </div>
</div>

{% endblock content %}
